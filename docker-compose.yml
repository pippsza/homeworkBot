# Бот ходить у вже піднятий контейнер Mongo (мережа web) - свою базу не тримаємо,
# на сервері 2 ГБ RAM. Qdrant не піднімаємо, поки QDRANT_ENABLED=false.
services:
  homework-server:
    image: pippsza/homework-server:latest
    container_name: HomeworkServer
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    networks:
      - web

  homework-client:
    image: pippsza/homework-client:latest
    container_name: HomeworkClient
    restart: unless-stopped
    ports:
      - "3100:80"
    depends_on:
      - homework-server
    networks:
      - web

networks:
  web:
    external: true
