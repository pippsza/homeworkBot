# Бот ходить у вже піднятий контейнер Mongo (мережа web) - свою базу не тримаємо,
# на сервері 2 ГБ RAM. Qdrant не піднімаємо, поки QDRANT_ENABLED=false.
services:
  homework-server:
    image: pippsza/homework-server:latest
    container_name: HomeworkServer
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      # Розклад і дедлайни задані київським часом; без цього контейнер
      # рахує їх в UTC і шле нагадування на три години пізніше.
      TZ: Europe/Kyiv
    env_file:
      - .env
    networks:
      - web

  homework-client:
    image: pippsza/homework-client:latest
    container_name: HomeworkClient
    restart: unless-stopped
    ports:
      - "3300:80"
    environment:
      TZ: Europe/Kyiv
    depends_on:
      - homework-server
    networks:
      - web

networks:
  web:
    external: true
